<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FitMar Gym</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h1>🏋️ FitMar Gym</h1>
            <p>Sistema de Gestión de Gimnasio</p>
        </div>
        
        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="usuario">Usuario o Correo Electrónico</label>
                <input type="text" id="usuario" placeholder="Ej: admin@fitmar.com">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña">
            </div>

            <div id="mensajeError" class="error-msg"></div>

            <button type="submit" class="btn-primary">Ingresar</button>
        </form>
        
        <div class="login-hint">
            <small>Credenciales de prueba: <b>admin@fitmar.com</b> / <b>12345</b></small>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
